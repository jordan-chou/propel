name: Suggest an improvement
description: Propose an enhancement to Propel or its publishing workflow.
title: "[Suggestion]: "
labels:
  - "type: enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Review the prefilled information before submitting. Do not include document content, personal or protected information, credentials, internal URLs, or full local file paths.

  - type: textarea
    id: details
    attributes:
      label: Improvement details
      description: Briefly describe the need and what would help.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Propel environment
      description: Prefilled by Propel. Revise or remove it if needed.
